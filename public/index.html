<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Two Player Tic Tac Toe - Timmy Nguyen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Two Player Tic Tac Toe</h1> <!--Main Hea4ding-->
    <p id="author">by Timmy</p>

    <div id="login"> <!--Login Section-->
        <input id="nameInput" placeholder="Username">
        <input id="passwordInput" type="password" placeholder="Password">

    <div id="status"></div>

    <canvas id="board" width="600" height="600"></canvas> <!--2d canvas-->

    <button id="resetBtn">Reset Game</button>
    
    <script src="client.js"></script>
</body>
